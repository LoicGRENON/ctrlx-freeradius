name: Build ctrlX-FreeRADIUS snap

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-snap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build snap (core24, amd64)
        id: build
        uses: snapcore/action-build@v1

      # Make sure the snap is installable once built
      - run: |
          sudo snap install --dangerous ${{ steps.build.outputs.snap }}

      - uses: actions/upload-artifact@v4
        with:
          name: ctrlx-freeradius-amd64
          path: ${{ steps.build.outputs.snap }}

      - name: Release (sur tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.snap }}
