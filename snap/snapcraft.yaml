name: ctrlx-freeradius
title: FreeRADIUS
version: "0.0.1"
summary: Serveur FreeRADIUS 802.1X/RADIUS pour ctrlX OS
description: |
  FreeRADIUS packagé en snap natif pour ctrlX OS 4.x. Fournit
  l'authentification RADIUS/802.1X (PEAP, EAP-TLS, PAP, ...) pour les
  switchs manageables de la machine, avec une mini interface web
  intégrée au portail ctrlX pour gérer la liste des utilisateurs
  et la configuration (clients/secrets).
base: core24
confinement: strict
grade: stable
license: MIT

platforms:
  amd64:

apps:
  freeradius:
    command: bin/radiusd.sh
    daemon: simple
    plugs:
      - network
      - network-bind

  webui:
    command: bin/webui.py
    daemon: simple
    plugs:
      - network
      - network-bind
    slots:
      - package-assets
      - package-run

parts:
  freeradius:
    plugin: nil
    stage-packages:
      - freeradius          # binaire + modules + config /etc/freeradius/3.0
      - freeradius-utils    # radtest, radclient, radmin
      - openssl             # génération des certificats EAP au 1er démarrage
      - make                # idem (Makefile des certificats)
    override-stage: |
      craftctl default
      # Alléger le snap : unités systemd, docs et mans inutiles
      rm -rf "$CRAFT_PART_INSTALL/lib/systemd" \
             "$CRAFT_PART_INSTALL/usr/share/doc" \
             "$CRAFT_PART_INSTALL/usr/share/man" || true

  scripts:
    plugin: dump
    source: scripts
    organize:
      "*": bin/

  configs:
    plugin: dump
    source: configs
    organize:
      "package-assets/*": package-assets/${CRAFT_PROJECT_NAME}/

slots:
  package-assets:
    interface: content
    content: package-assets
    source:
      read:
        - $SNAP/package-assets/${CRAFT_PROJECT_NAME}
  package-run:
    interface: content
    content: package-run
    source:
      write:
        - $SNAP_DATA/package-run/${CRAFT_PROJECT_NAME}
